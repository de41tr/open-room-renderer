friendly_name: "Open Room Renderer"
manufacturer: "Independent"
model_name: "Linux Room Renderer"
model_number: "alpha-0.1"
uuid: null
# Leave discovery defaults implicit so existing neutral identities survive
# upgrades. Fresh state uses WiiM discovery, mDNS and SOAP port 59152.
# Explicit wiim_home_profile: true opts an existing identity into that profile.
http_api_port: 8080
bind_address: "0.0.0.0"
advertise_ip: null
mpv_socket: ".state/mpv.sock"
auto_spawn_mpv: true
# Optional exact mpv device name; needs an unused, private IPC socket at startup.
# List as the service user: mpv --no-config --audio-device=help
mpv_audio_device: null
default_volume: 50
default_mute: false
log_level: "INFO"
state_dir: ".state"
enable_ssdp: true
log_wiim_http_details: false
source_experiment_variant: "none"
legacy_capability_value: "0x0"
legacy_plm_support_value: "0"
proxy_on_demand_audio: false
# Exact LAN media hosts only; loopback/metadata destinations stay forbidden.
proxy_allowed_lan_hosts: []
range_seek_reload: false
podcast_presets:
  - name: "Test MP3"
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
experimental_sources:
  - id: "example-radio"
    name: "Example Radio"
    source: "Example Radio"
    url: "https://example.invalid/"
    icon: ""
    type: "radio"
    enabled: false
