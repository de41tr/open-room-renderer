# Open Room Renderer example configuration.
# This file uses synthetic placeholder values only. Do not put real tokens,
# cookies, serial numbers, private keys, copied device IDs, or account data here.

friendly_name = "Open Room Renderer"
manufacturer = "Independent"
model_name = "Linux Room Renderer"
model_number = "alpha-0.1"

# Leave uuid empty/null in YAML configs to generate local state. If your TOML
# loader maps this into the Python config, use a synthetic UUID only.
uuid = "00000000-0000-4000-8000-000000000000"

http_api_port = 80
upnp_port = 80
bind_address = "0.0.0.0"

# Leave unset in normal use so the renderer detects the LAN address.
advertise_ip = ""

mpv_socket = "/tmp/open-room-renderer-mpv.sock"
auto_spawn_mpv = true
default_volume = 50
log_level = "INFO"
state_dir = ".state"

enable_mdns = false
enable_ssdp = true

# Verbose request/response logging is private debugging only. Keep false for
# normal use and never publish raw logs.
log_wiim_http_details = false

# Playback/DSP features.
proxy_on_demand_audio = false
range_seek_reload = false
channel_balance = "0.0"

[[podcast_presets]]
name = "Synthetic Test MP3"
url = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
