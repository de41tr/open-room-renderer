name: Good first issue
description: Propose a small beginner-friendly task.
title: "[Good first issue]: "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the small, safe change.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Suggested files
      placeholder: "README.md, docs/demo.md, tests/test_status_json.py..."
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Docs updated
        - Synthetic test added
        - pytest passes
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: Does not require proprietary material, raw dumps, real identifiers, tokens, keys, or credentials.
          required: true
        - label: Does not involve authentication, DRM, signature, pairing, certificate, or access-control bypass.
          required: true
